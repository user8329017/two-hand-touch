<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>League Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=Playfair+Display:ital,wght@0,700;0,900;1,900&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Graduate&family=Barlow:wght@400;500;600;700&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <script>
    // Theme choices: night, press, varsity, arcade, memo. Visitors can switch with the menu in the header.
    window.DEFAULT_THEME = 'memo';
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || DEFAULT_THEME; }
    catch { document.documentElement.dataset.theme = DEFAULT_THEME; }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🏈</span>
      <div>
        <div class="brand-name" id="league-name">League Lab</div>
        <div class="brand-sub" id="league-sub">Sleeper fantasy football, upgraded</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="topbar-right" id="topbar-right"></div>
      <select id="theme-picker" title="Change the look">
        <option value="memo">Look: Office Memo</option>
        <option value="press">Look: Sports Page</option>
        <option value="varsity">Look: Varsity</option>
        <option value="arcade">Look: Arcade</option>
        <option value="night">Look: Night Game (original)</option>
      </select>
    </div>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <a href="#standings" data-tab="standings">Projected Standings</a>
    <a href="#matchups" data-tab="matchups">Matchups</a>
    <a href="#power" data-tab="power">Power Rankings</a>
    <a href="#trades" data-tab="trades">Trade Grades</a>
    <a href="#awards" data-tab="awards">Top Jerry &amp; Shower King</a>
  </nav>
  <main id="app"></main>
  <footer class="footer">Data from the public Sleeper API. Projections use Sleeper's weekly player projections scored with your league's settings.</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
