<!doctype html>
<html lang="en" data-theme="memo">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sandusky’s Two Hand Touch League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🏈</span>
      <div>
        <div class="brand-name" id="league-name">Sandusky’s Two Hand Touch League</div>
        <div class="brand-sub" id="league-sub">Loading…</div>
      </div>
    </div>
    <div class="topbar-right" id="topbar-right"></div>
  </header>
  <nav class="tabs" id="tabs" hidden>
    <a href="#standings" data-tab="standings">Projected Standings</a>
    <a href="#matchups" data-tab="matchups">Matchups</a>
    <a href="#power" data-tab="power">Power Rankings</a>
    <a href="#trades" data-tab="trades">Trade Grades</a>
    <a href="#awards" data-tab="awards">Top Jerry &amp; Shower King</a>
  </nav>
  <main id="app"></main>
  <footer class="footer">Data from the public Sleeper API. Projections use Sleeper's weekly player projections scored with your league's settings.</footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
